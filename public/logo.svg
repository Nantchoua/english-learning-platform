<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <!-- Premium Gradient for the icon representing forward speaking progress -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- ICON CONTAINER -->
  <g transform="translate(10, 10)">
    <!-- Main speech bubble representation (Black) -->
    <path d="M 40 10 C 20 10, 10 20, 10 40 C 10 60, 20 70, 40 70 L 40 80 L 52 70 C 65 70, 70 60, 70 40 C 70 20, 60 10, 40 10 Z" fill="#111827" />
    
    <!-- Forward express double-chevron representing speed and fluency (Green Gradient) -->
    <path d="M 32 30 L 42 40 L 32 50" fill="none" stroke="url(#greenGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 44 30 L 54 40 L 44 50" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <!-- "Speaking Express" in bold Slate-900 (black equivalent in web) -->
  <text x="100" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#111827" letter-spacing="-0.5">
    Speaking<tspan fill="#10B981">Express</tspan>
  </text>
  
  <!-- "English Academy" in thin modern tracking -->
  <text x="100" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#6B7280" letter-spacing="4">
    ENGLISH ACADEMY
  </text>
</svg>
